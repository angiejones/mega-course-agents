<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEGA Store exchange</title>
<style>
:root{font-family:'Helvetica Neue',Helvetica,sans-serif;color:#172b28;background:#f8f6ef;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:780px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bdc7be;padding-bottom:17px}.brand{font-family:Georgia,serif;font-weight:bold;font-size:24px;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#54645a}h1{font-family:Georgia,serif;font-size:36px;font-weight:normal;margin:25px 0 8px}p{line-height:1.5}#status{color:#46584e;margin:0 0 20px}.products{display:grid;grid-template-columns:1fr 1fr;gap:18px}.product{background:#eeede3;padding:20px}.product svg,.product img{width:100%;height:145px;object-fit:contain;display:block;margin:6px 0 15px}.product h2{font-size:17px;margin:10px 0 5px}.product p{margin:0;font-size:14px;color:#53605b}.size{font-size:12px;background:#fff;padding:5px 9px;display:inline-block;float:right;border:1px solid #cad1c9}.totals{padding:14px 0}dl{margin:0}dl div{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}dd{margin:0;font-variant-numeric:tabular-nums}.due{border-top:1px solid #bdc7be;margin-top:6px;padding-top:14px!important;font-size:20px!important;font-weight:600}.actions{display:flex;gap:12px;margin-top:18px}button{font:inherit;font-weight:600;padding:14px 22px;border:1px solid #254f3d;border-radius:3px;cursor:pointer}#confirm{background:#254f3d;color:#fff;flex:1}#decline{background:transparent;color:#254f3d}button:focus-visible{outline:3px solid #c17935;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.note{font-size:12px;color:#627066;margin:18px 0 0}#error{color:#963b26;font-size:14px}[hidden]{display:none!important}@media(max-width:460px){body{padding:16px}h1{font-size:29px}.product{padding:12px}.product svg,.product img{height:110px}.eyebrow{letter-spacing:1px}}
#outcome{margin-top:18px;padding:18px 20px;background:#e6eee5;border-left:4px solid #254f3d;border-radius:3px}#outcome h2{font-size:22px;margin:0 0 8px}#outcome p{margin:0;overflow-wrap:anywhere}#outcome:focus-visible{outline:2px solid #254f3d;outline-offset:3px}
</style></head><body><main>
<header><span class="brand">MEGA Store</span><span class="eyebrow">Customer care</span></header>
<h1 id="heading">Review your exchange</h1><p id="status" role="status" aria-live="polite">Loading your exchange details…</p>
<section id="details" hidden><div class="products"><article class="product" id="original"><span class="eyebrow">Returning</span><span class="size"></span><div class="image"></div><h2></h2><p></p></article><article class="product" id="replacement"><span class="eyebrow">Receiving</span><span class="size"></span><div class="image"></div><h2></h2><p></p></article></div>
<div class="totals"><dl><div><dt>Return credit</dt><dd id="credit"></dd></div><div><dt>Replacement</dt><dd id="cost"></dd></div><div><dt>Exchange fee</dt><dd id="fee"></dd></div><div class="due"><dt>Amount due</dt><dd id="due"></dd></div></dl></div></section>
<div class="actions" id="actions" hidden><button id="confirm">Confirm exchange</button><button id="decline">Decline</button></div>
<section id="outcome" role="status" aria-live="polite" tabindex="-1" hidden><h2 id="outcome-heading"></h2><p id="outcome-message"></p></section>
<p id="error" role="alert"></p><p class="note">Your exchange is created only after you confirm and the store completes its checks.</p>
</main><!-- APP_SCRIPT --></body></html>
